# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: combined workflow

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 */2 * * *'

permissions:
  contents: write
  
jobs:
  combined-workflow:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      working-directory: data/
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install
    
    - name: Run code
      working-directory: data/
      run: python -m pipenv run python main.py --mail ${{ secrets.KB_MAIL }} --pw ${{ secrets.KB_PW }} --league="${{ secrets.KB_LEAGUE }}" --start ${{ secrets.START_DATE }}
    
    - name: Commit updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -f data/data/matchday_teams.json

        if git diff --cached --quiet; then
          echo "No changes to matchday_teams.json"
        else
          git commit -m "Update matchday teams"
          git push
        fi
        
        git add -f data/data/team_values.json

        if git diff --cached --quiet; then
          echo "No changes to team_values.json"
        else
          git commit -m "Update team values"
          git push
        fi


        git add -f data/data/budget_sum.json

        if git diff --cached --quiet; then
          echo "No changes to budget_sum.json"
        else
          git commit -m "Update matchday teams"
          git push
        fi

        git add -f data/data/gain.json

        if git diff --cached --quiet; then
          echo "No changes to gain.json"
        else
          git commit -m "Update matchday teams"
          git push
        fi
        

    - name: Copy result
      run: cp data/data/*.json frontend/src/data

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build frontend
      working-directory: frontend/
      run: |
        ls -la
        npm ci
        CI=false && npm run build --if-present
    
    - name: Deploy frontend
      working-directory: frontend/
      run: |
        git config --global user.name $user_name
        git config --global user.email $user_email
        git remote set-url origin https://${github_token}@github.com/${repository}
        npm run deploy
      env:
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        github_token: ${{ secrets.GH_TOKEN }}
        repository: ${{ github.repository }}
